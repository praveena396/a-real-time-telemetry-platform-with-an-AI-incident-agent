name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telemetry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d telemetry"
          --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Type check
        run: mypy
      - name: Tests (unit + TimescaleDB integration)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Detector comparison (smoke)
        run: python -m app.compare --devices 5 --steps 1500
      - name: Agent eval on recorded incidents
        run: python -m app.agent.eval run
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t telemetry-sentinel .
